<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="twins.png">
    <title>Twins Menu - Location ✨</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .location-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }

        .map-wrapper {
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-soft);
            margin: 30px 0;
            border: 5px solid white;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .btn-social {
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            color: white;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .btn-menu {
            background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
            box-shadow: 0 5px 15px rgba(255, 107, 53, 0.3);
        }

        .btn-insta {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            box-shadow: 0 5px 15px rgba(220, 39, 67, 0.3);
        }

        .btn-fb {
            background: #1877f2;
            box-shadow: 0 5px 15px rgba(24, 119, 242, 0.3);
        }

        .btn-social:hover {
            transform: translateY(-3px);
            color: white;
        }
    </style>
</head>
<body>

    <header class="hero" style="padding-bottom: 20px;">
        <img src="twins.png" alt="Café Twins" class="logo">
        <h2>Soyez le bienvenu</h2>
        <div class="tagline">Good coffee • Sweet moments</div>
    </header>

    <main class="location-container">
        
        <div class="buttons">
            <a href="index.html" class="btn-social btn-menu">← Retour au Menu</a>
            <a href="https://www.instagram.com/twins_nabeul?igsh=MTUzZDExOGp1ajBpdA==" target="_blank" class="btn-social btn-insta">Instagram</a>
            <a href="https://www.facebook.com/twinsnabeul" target="_blank" class="btn-social btn-fb">Facebook</a>
        </div>

        <div class="map-wrapper">
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3159.636279850696!2d10.735694861333522!3d36.45031563226009!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x13029894969f29b1%3A0xbcb4820a0c949caa!2sTwins!5e0!3m2!1sfr!2stn!4v1770619085558!5m2!1sfr!2stn" 
                width="100%" 
                height="450" 
                style="border:0;" 
                allowfullscreen="" 
                loading="lazy" 
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </div>

    </main>

</body>
</html>
